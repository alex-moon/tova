services:
  backend:
    image: alpine:3.21
    command:
      - sh
      - -c
      - |
        echo "boot: smoke emitter up"
        i=0
        while true; do
          i=$$((i+1))
          echo "stdout: heartbeat $$i"
          echo "stderr: simulated failure $$i" >&2
          sleep 2
        done
    networks:
      - smoke

  loki:
    image: grafana/loki:3.7.3
    command: ['-config.file=/etc/loki/config.yml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - smoke

  alloy:
    image: grafana/alloy:v1.19.2
    command: ['run', '/etc/alloy/config.alloy', '--server.http.listen-addr=0.0.0.0:12345']
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - smoke

volumes:
  loki_data:

networks:
  smoke:
