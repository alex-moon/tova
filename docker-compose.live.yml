services:
  # One-shot migration runner on the compose network; the backend waits for it via service_completed_successfully.
  # @see #257
  migrations:
    build:
      context: .
      dockerfile: apps/migrations/Dockerfile
    env_file:
      - .env
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    # Keep the container up across crashes and host reboots (compose default is "no").
    # @see #358
    restart: unless-stopped
    ports:
      - '15000:5000'
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    ports:
      - '15173:4173'
    depends_on:
      - backend

  # Alloy tails the compose containers and pushes to Grafana Cloud Loki; credentials come from .env.
  # @see #179
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command: ['run', '/etc/alloy/config.alloy']
    environment:
      - LOKI_URL=${LOKI_URL}
      - LOKI_USERNAME=${LOKI_USERNAME}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
      - frontend
