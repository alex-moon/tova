services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    ports:
      - '15000:5000'
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    ports:
      - '15173:4173'
    depends_on:
      - backend

