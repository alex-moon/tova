services:
  # #257: one-shot migration runner on the compose network. Same .env as the
  # backend, so it connects to exactly the same DB (Atlas MONGODB_URL or the
  # compose mongo), runs `up`, and exits. The backend waits for
  # service_completed_successfully, replacing the old host-side
  # migrate-then-restart-backend dance in scripts/deploy.sh.
  migrations:
    build:
      context: .
      dockerfile: apps/migrations/Dockerfile
    env_file:
      - .env
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    # #358: an uncaught-exception crash (tesseract/tessdata, Oct 16) left the
    # backend dead until the next deploy — compose's default restart policy is
    # "no". Keep the container up across crashes and host reboots.
    restart: unless-stopped
    ports:
      - '15000:5000'
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    ports:
      - '15173:4173'
    depends_on:
      - backend

  # #179: logs ship to Grafana Cloud (hosted Loki). Alloy tails the compose
  # containers and pushes over the Loki push API; LOKI_URL / LOKI_USERNAME /
  # LOKI_PASSWORD (Grafana Cloud Loki basic auth) come from .env.
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command: ['run', '/etc/alloy/config.alloy']
    environment:
      - LOKI_URL=${LOKI_URL}
      - LOKI_USERNAME=${LOKI_USERNAME}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
      - frontend
