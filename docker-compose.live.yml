services:
  mongodb:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=tova
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    ports:
      - '15000:5000'
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    ports:
      - '15173:4173'
    depends_on:
      - backend

volumes:
  mongodb_data:
