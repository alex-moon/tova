services:
  mongodb:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm start
    ports:
      - '15000:5000'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/tova
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./src/client
      dockerfile: Dockerfile
    ports:
      - '15173:4173'
    depends_on:
      - backend

volumes:
  mongodb_data:
