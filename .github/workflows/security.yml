name: Security

# Pull-request scans. On push to main the same scans run inside the CI
# workflow (ci.yml) so the deploy gate covers them — see the gitleaks job
# comment there.
on:
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (default OSS rules)
        run: semgrep scan --config p/default --error --metrics=off src/server

  # dependency-review-action needs GitHub Advanced Security on private repos,
  # which this repository doesn't have; osv-scanner over the lockfile covers
  # the same ground self-contained (issue #32 mentions it as the
  # self-contained alternative).
  osv-scanner:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/google/osv-scanner:latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan package-lock.json for known vulnerabilities
        run: osv-scanner --lockfile=package-lock.json

  npm-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --fail-on=all
