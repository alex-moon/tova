name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Which areas of the repo a PR touched, so the `ci` job below only runs
  # the gate steps affected by the change (issue #141: free-tier minutes).
  # Direct CLI diff, not a vendor paths-filter action: this repo keeps a
  # no-third-party-actions convention (see the gitleaks/osv-scanner notes).
  # Push runs skip detection entirely — their steps run unconditionally so
  # the deploy gate always validates the full merge result.
  changed:
    runs-on: ubuntu-latest

    outputs:
      server: ${{ steps.detect.outputs.server }}
      client: ${{ steps.detect.outputs.client }}
      deps: ${{ steps.detect.outputs.deps }}
      tooling: ${{ steps.detect.outputs.tooling }}
      e2e: ${{ steps.detect.outputs.e2e }}

    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # Push to main: no staging, full gate.
            echo "server=true client=true deps=true tooling=true e2e=true" |
              tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$(git merge-base origin/main HEAD)" HEAD > /tmp/changed-files.txt

          if [[ ! -s /tmp/changed-files.txt ]]; then
            # Empty diff (race between dispatch and merge-base): full gate.
            echo "server=true client=true deps=true tooling=true e2e=true" |
              tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Config/tooling changes can affect anything: force both sides
          # on. Dependency changes force the server gate (cheapest proxy
          # for lockfile changes that touch runtime code).
          server=false
          client=false
          deps=false
          tooling=false
          e2e=false

          while IFS= read -r file; do
            case "$file" in
              apps/server/*|apps/shared/*|apps/migrations/*|Dockerfile)
                server=true ;;
              apps/client/*)
                client=true
                e2e=true ;;
              e2e/*)
                e2e=true ;;
              package.json|package-lock.json|apps/*/package.json)
                deps=true ;;
              eslint.config.js|tsconfig*.json|apps/*/tsconfig*.json|jest.config.js|.prettierrc|prettier.config.*)
                tooling=true ;;
              .github/*)
                # Workflow changes affect the gate itself: run everything.
                tooling=true
                e2e=true ;;
            esac
          done < /tmp/changed-files.txt

          if [[ "$tooling" == true ]]; then
            server=true
            client=true
          fi
          if [[ "$deps" == true ]]; then
            server=true
          fi

          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  ci:
    runs-on: ubuntu-latest
    needs: changed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Server lint
        if: needs.changed.outputs.server == 'true'
        run: npm run lint:server

      - name: Server typecheck
        if: needs.changed.outputs.server == 'true'
        run: npm run typecheck

      - name: Server tests
        if: needs.changed.outputs.server == 'true'
        run: npm run test:server

      # Repo-wide prettier (covers server and client, both lockfiles): runs
      # unconditionally so a mixed PR can't slip through with one side
      # skipped. Kept single and repo-wide instead of per-side duplications.
      - name: Format check
        run: npm run format:check

      - name: Client lint
        if: needs.changed.outputs.client == 'true'
        run: npm run lint:client

      - name: Client tests
        if: needs.changed.outputs.client == 'true'
        run: npm run test:client

      - name: Client build
        if: needs.changed.outputs.client == 'true'
        run: npm run build:client

  # Responsive e2e gate (#220): the mobile (375x667) and desktop Playwright
  # projects must pass, so a route that overflows at phone width or a stale
  # assertion is caught mechanically. Gated on client/e2e changes to respect
  # the free-tier-minutes constraint (#141) — a server-only PR skips it.
  #
  # Runs against the local stack the way a developer does: a Mongo container,
  # migrations (seeds the admin user), `db:password` (fixture
  # password `password`, see AGENTS.md), then the dev server + Vite client.
  # The chat stream is mocked inside the specs, so no provider keys are needed.
  #
  # #257: Mongo runs via a login + `docker run` step, not a `services:` block —
  # service images are pulled before any step can authenticate, so with
  # Docker Hub rate-limiting anonymous pulls the job could fail before it
  # started. A step-based container can log in first (same fix as semgrep).
  e2e:
    runs-on: ubuntu-latest
    needs: changed
    if: needs.changed.outputs.e2e == 'true'

    env:
      MONGODB_HOST: localhost
      MONGODB_PASSWORD: tova
      E2E_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Direct CLI docker login (repo convention: no third-party actions).
      # Skipped when the repo secrets are unset — pulls fall back to anonymous.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Start fixture Mongo
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=tova \
            -e MONGO_INITDB_ROOT_PASSWORD=tova \
            mongo:latest
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/27017) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "mongo is up"
              exit 0
            fi
            sleep 2
          done
          echo "mongo did not come up" >&2
          exit 1

      - name: Migrate and set the test fixture password
        run: |
          npm run db:migrate
          npm run db:password

      - name: Start the dev stack
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null && curl -sf http://localhost:5000/api/health >/dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "dev stack failed to come up" >&2
          exit 1

      - name: Responsive e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  # Security scans gated on deploy: these run on main pushes only (same
  # workflow run as `ci`) and the gate below requires them, so deploy
  # (triggered via workflow_run on CI success) can never race past a failed
  # scan — they are a deploy gate, not a merge gate. PRs do not run them
  # (issue #141: scans cease to be a merge gate; security.yml was removed).
  gitleaks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Direct CLI, not gitleaks-action: its v2 PR/reporting flow needs
      # GitHub API calls this repo can't satisfy.
      - name: Detect secrets in full git history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --redact --no-banner

  # #257: semgrep runs via a login + `docker run` step instead of a job
  # `container:` — container images are pulled before any step can
  # authenticate (same reason the e2e job dropped its services: block).
  semgrep:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Semgrep scan (default OSS rules)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep --config p/default --error --metrics=off apps/server/src

  npm-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # better-npm-audit wraps `npm audit` and honours the .nsprc allowlist of
      # accepted-risk advisories (npm audit itself has no ignore mechanism).
      - name: Audit production dependencies
        run: npm run audit

  # dependency-review-action needs GitHub Advanced Security on private repos,
  # which this repository doesn't have; osv-scanner over the lockfile covers
  # the same ground self-contained (issue #32 mentions it as the
  # self-contained alternative). Ported here from the removed security.yml
  # so lockfile scanning stays part of the main-side deploy gate.
  osv-scanner:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Image is scratch-based (no shell), so run it directly via docker.
    steps:
      - uses: actions/checkout@v4

      - name: Scan package-lock.json for known vulnerabilities
        run: docker run --rm -v "$PWD:/repo" ghcr.io/google/osv-scanner:latest --lockfile=/repo/package-lock.json

  # `workflow_run` can report `conclusion: success` for a cancelled run
  # (known Actions quirk), which would trigger deploy. This gate always
  # runs and fails unless everything it guards succeeded — including when
  # a job was cancelled — so a cancelled run never looks successful.
  ci-gate:
    needs: [ci, e2e, gitleaks, semgrep, npm-audit, osv-scanner]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless ci and security scans succeeded
        run: |
          event="${{ github.event_name }}"
          if [[ "$event" == "push" ]]; then
            # On push to main, deploy follows this run: every guard must pass.
            for status in "${{ needs.ci.result }}" "${{ needs.e2e.result }}" "${{ needs.gitleaks.result }}" "${{ needs.semgrep.result }}" "${{ needs.npm-audit.result }}" "${{ needs.osv-scanner.result }}"; do
              if [[ "$status" != "success" ]]; then
                echo "guard status: $status"
                exit 1
              fi
            done
          else
            # PR run: deploy is gated on push-to-main runs only; PR-side
            # scans were removed (scans are a deploy gate, not a merge gate).
            # The e2e job is skipped when no client/e2e change touched the PR
            # (issue #141), so only a failed run fails the gate — skipped is fine.
            if [[ "${{ needs.ci.result }}" != "success" ]]; then
              echo "ci result: ${{ needs.ci.result }}"
              exit 1
            fi
            e2e="${{ needs.e2e.result }}"
            if [[ "$e2e" != "success" && "$e2e" != "skipped" ]]; then
              echo "e2e result: $e2e"
              exit 1
            fi
          fi
