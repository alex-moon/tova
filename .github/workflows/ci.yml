name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs (e.g. follow-up agent commits racing the previous CI) cancel in flight.
concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas a PR touched so the ci job runs only affected gates; push runs get the full gate.
  # @see #141
  changed:
    runs-on: ubuntu-latest

    outputs:
      server: ${{ steps.detect.outputs.server }}
      client: ${{ steps.detect.outputs.client }}
      deps: ${{ steps.detect.outputs.deps }}
      tooling: ${{ steps.detect.outputs.tooling }}

    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # Push to main: no staging, full gate.
            echo "server=true client=true deps=true tooling=true" |
              tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$(git merge-base origin/main HEAD)" HEAD > /tmp/changed-files.txt

          if [[ ! -s /tmp/changed-files.txt ]]; then
            # Empty diff (race between dispatch and merge-base): full gate.
            echo "server=true client=true deps=true tooling=true" |
              tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Config/tooling changes force both sides; dependency changes force the server gate.
          server=false
          client=false
          deps=false
          tooling=false

          while IFS= read -r file; do
            case "$file" in
              apps/server/*|apps/shared/*|apps/migrations/*|Dockerfile)
                server=true ;;
              apps/client/*)
                client=true ;;
              package.json|package-lock.json|apps/*/package.json)
                deps=true ;;
              eslint.config.js|tsconfig*.json|apps/*/tsconfig*.json|jest.config.js|.prettierrc|prettier.config.*)
                tooling=true ;;
              .github/*)
                # Workflow changes affect the gate itself: run everything.
                tooling=true ;;
            esac
          done < /tmp/changed-files.txt

          if [[ "$tooling" == true ]]; then
            server=true
            client=true
          fi
          if [[ "$deps" == true ]]; then
            server=true
          fi

          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"

  ci:
    runs-on: ubuntu-latest
    needs: changed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Server lint
        if: needs.changed.outputs.server == 'true'
        run: npm run lint:server

      - name: Server typecheck
        if: needs.changed.outputs.server == 'true'
        run: npm run typecheck

      - name: Server tests
        if: needs.changed.outputs.server == 'true'
        run: npm run test:server

      # Repo-wide prettier runs unconditionally so a mixed PR can't slip through.
      - name: Format check
        run: npm run format:check

      - name: Client lint
        if: needs.changed.outputs.client == 'true'
        run: npm run lint:client

      - name: Client tests
        if: needs.changed.outputs.client == 'true'
        run: npm run test:client

      - name: Client build
        if: needs.changed.outputs.client == 'true'
        run: npm run build:client

  # Security scans are a deploy gate (main pushes only), not a merge gate.
  # @see #141
  gitleaks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Direct CLI, not gitleaks-action: its v2 flow needs API calls this repo can't satisfy.
      - name: Detect secrets in full git history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --redact --no-banner

  # Semgrep runs via login + docker run: container images pull before any step can authenticate.
  # @see #257
  semgrep:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

      - name: Semgrep scan (default OSS rules)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep --config p/default --error --metrics=off apps/server/src/main

  npm-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # better-npm-audit honours the .nsprc allowlist (npm audit has no ignore mechanism).
      - name: Audit production dependencies
        run: npm run audit

  # osv-scanner over the lockfile: self-contained alternative to dependency-review-action (needs GH Advanced Security).
  # @see #32
  osv-scanner:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Image is scratch-based (no shell), so run it directly via docker.
    steps:
      - uses: actions/checkout@v4

      - name: Scan package-lock.json for known vulnerabilities
        run: docker run --rm -v "$PWD:/repo" ghcr.io/google/osv-scanner:latest --lockfile=/repo/package-lock.json

  # Gate always runs and fails unless every guard succeeded — a cancelled workflow_run must never look successful.
  # e2e is not in this gate: it moved to e2e-nightly.yml (nightly schedule + manual dispatch).
  # @see #141
  ci-gate:
    needs: [ci, gitleaks, semgrep, npm-audit, osv-scanner]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless ci and security scans succeeded
        run: |
          event="${{ github.event_name }}"
          if [[ "$event" == "push" ]]; then
            # On push to main, deploy follows this run: every guard must pass.
            for status in "${{ needs.ci.result }}" "${{ needs.gitleaks.result }}" "${{ needs.semgrep.result }}" "${{ needs.npm-audit.result }}" "${{ needs.osv-scanner.result }}"; do
              if [[ "$status" != "success" ]]; then
                echo "guard status: $status"
                exit 1
              fi
            done
          else
            # PR runs: scans are a deploy gate only.
            # @see #141
            if [[ "${{ needs.ci.result }}" != "success" ]]; then
              echo "ci result: ${{ needs.ci.result }}"
              exit 1
            fi
          fi
