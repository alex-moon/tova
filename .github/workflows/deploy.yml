name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Post-deploy eval smoke disabled: it was warn-only (continue-on-error) and
    # only pushed to the LangSmith `tova-evals` dataset, nothing the app reads.
    # It needed a `mongo:7` service container pull, which failed without Docker
    # Hub credentials. Re-enable by restoring the `services: mongo` block and the
    # "Post-deploy evals" step — service images are pulled before any step can
    # authenticate, so convert it to a login + `docker run` step instead (the
    # pattern the e2e job uses in ci.yml). The nightly all-models sweep still
    # runs separately (see .iteration/docs/plan-158-more-evals.md).

    # Runs only on successful pushes to main (not PR events).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 142.93.42.191 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to ajmoon.com
        # DOCKERHUB_* authenticate the deploy host's `docker compose build`
        # pulls (scripts/deploy.sh pipes the token through ssh stdin).
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          npm run deploy
