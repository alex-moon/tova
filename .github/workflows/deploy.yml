name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Runs only on successful pushes to main (not PR events).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ajmoon.com >> ~/.ssh/known_hosts

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The ssh `ajmoon` alias (host 142.93.42.191, user root) is configured on
      # the fly so the existing scripts/deploy.sh works unchanged on the runner.
      - name: Deploy to ajmoon.com
        run: |
          cat >> ~/.ssh/config <<EOF
          Host ajmoon
              HostName 142.93.42.191
              User root
          EOF
          npm run deploy
