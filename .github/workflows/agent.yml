# Personal coding agent: triggered by "@agent" comments/issues or manually; powered by the Goose CLI + DeepInfra.

name: Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for the agent"
        required: true

concurrency:
  group: agent-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body || '', '@agent')) ||
      (github.event_name == 'issues' && startsWith(github.event.issue.body || '', '@agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For PR comments, check out the PR head rather than the default branch.
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Install goose
        uses: clouatre-labs/setup-goose-action@v1
        with:
          version: '1.52.0'

      - name: Configure git + gh auth
        run: |
          git config user.name "tova-agent"
          git config user.email "tova-agent@users.noreply.github.com"
          git config --global credential.helper '!gh auth git-credential'

      - name: Build task + pick model
        id: task
        env:
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_PROMPT: ${{ github.event.inputs.prompt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_PROMPT:-}" ]; then
            INSTRUCTION="$MANUAL_PROMPT"
          elif [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            INSTRUCTION="$ISSUE_BODY"
          else
            INSTRUCTION="$COMMENT"
          fi

          case "$INSTRUCTION" in
            '@agent-think'*) MODEL='zai-org/GLM-5.3-Flash' ;;
            *)               MODEL='deepseek-ai/DeepSeek-V4.1-Flash' ;;
          esac
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

          INSTRUCTION="${INSTRUCTION#"@agent-think"}"
          INSTRUCTION="${INSTRUCTION#"@agent"}"
          printf '%s\n' "$INSTRUCTION" > instruction.txt

          CONTEXT=context.md
          : > "$CONTEXT"

          if [ "$IS_PR" = 'true' ]; then
            {
              printf '## PR #%s\n\n' "$NUMBER"
              # Title, branches, merge state (DIRTY = merge conflicts), body.
              gh pr view "$NUMBER" --repo "$REPO" \
                --json title,body,headRefName,baseRefName,mergeStateStatus \
                --jq '"**" + .title + "** — `" + .headRefName + "` → `" + .baseRefName + "`, merge state: " + (.mergeStateStatus // "unknown") + "\n\n" + (.body // "" | .[0:8000])' \
                || printf '(could not read PR #%s)\n' "$NUMBER"
              printf '\n### CI checks (non-passing)\n\n'
              gh pr view "$NUMBER" --repo "$REPO" --json statusCheckRollup \
                --jq '.statusCheckRollup[] | select((.conclusion // "") != "SUCCESS" and (.conclusion // "") != "NEUTRAL") | "- " + .name + ": " + (.conclusion // "pending")' \
                || true
              printf '\n### Thread comments\n\n'
              gh pr view "$NUMBER" --repo "$REPO" --json comments \
                --jq '.comments[] | "**" + .author.login + "**: " + (.body | .[0:2000])' \
                | head -c 12000 || true
              # Remember the branch so the working rules can point at it.
              gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName \
                > pr-branch.txt || true
            } >> "$CONTEXT" || true
          else
            {
              printf '## Issue #%s\n\n' "$NUMBER"
              printf '**%s**\n\n%s\n' "$ISSUE_TITLE" "$(printf '%s' "$ISSUE_BODY" | head -c 8000)"
              printf '\n### Thread comments\n\n'
              gh issue view "$NUMBER" --repo "$REPO" --json comments \
                --jq '.comments[] | "**" + .author.login + "**: " + (.body | .[0:2000])' \
                | head -c 12000 || true
            } >> "$CONTEXT" || true
          fi

          for num in $(grep -hoE '#[0-9]+' "$CONTEXT" instruction.txt 2>/dev/null \
                         | tr -d '#' | grep -v "^$NUMBER\$" | sort -un | head -5); do
            {
              printf '\n#### Referenced ticket #%s\n\n' "$num"
              gh issue view "$num" --repo "$REPO" --json title,body \
                --jq '"**" + .title + "**\n\n" + (.body // "" | .[0:8000])' >> "$CONTEXT" 2>/dev/null \
                || gh pr view "$num" --repo "$REPO" --json title,body \
                     --jq '"**" + .title + "**\n\n" + (.body // "" | .[0:8000])' >> "$CONTEXT" 2>/dev/null \
                || printf '(could not fetch #%s)\n' "$num" >> "$CONTEXT"
            } || true
          done

      - name: Run goose
        env:
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: ${{ steps.task.outputs.model }}
          OPENAI_HOST: https://api.deepinfra.com
          OPENAI_BASE_PATH: v1/openai/chat/completions
          OPENAI_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          set -euo pipefail
          {
            echo "Task for you (from Alex):"
            printf 'Instruction:\n%s\n' "$(cat instruction.txt)"
            if [ -s context.md ]; then
              printf '\nThread context (auto-gathered; use gh for anything deeper):\n'
              cat context.md
            fi
            printf '\nWorking rules:\n'
            printf '%s\n' \
              '- NEVER push or commit directly to main.' \
              "- Keep the diff minimal; touch only what the task needs." \
              '- Run `npm run ci` and make sure it passes locally before opening the PR (lint, format, typecheck, server tests, client lint/tests/build).' \
              '- If the task mentions CI failures, read the actual logs first: gh run list, then gh run view <id> --log-failed.' \
              '- In the PR body, summarise what you changed and why, and reference the triggering issue if there is one.'
            if [ "$IS_PR" = 'true' ] && [ -s pr-branch.txt ]; then
              printf '%s\n' "- This task was triggered on an existing PR (branch: $(cat pr-branch.txt)). Commit your work and push to that branch — do NOT open a new PR."
            else
              printf '%s\n' "- Create a branch named agent/task, commit your work there, push it, and open a PR against main using the gh CLI."
            fi
          } > task.txt
          # --no-session skips session-file state, the docs' recommendation for CI one-offs.
          goose run --no-session -t "$(cat task.txt)"
