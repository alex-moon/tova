# Accepted-risk entries for advisories with no compatible fix (a "fixed
# version" that is a breaking major of a transitive/build-time package).
#
# Each entry is time-boxed: once `ignoreUntil` passes, the scan fails again so
# the exception is revisited. Remove an entry as soon as its dependency can be
# bumped to a patched release.

